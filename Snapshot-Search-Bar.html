  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: transparent;
  }
  .search-wrap {
    width: 100%;
  }
  .blue-box {
    background: #0071BA;
    border: 1px solid #0071BA;
    padding: 16px 18px 18px;
  }
  .top-row {
    display: flex;
    align-items: center;
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .logo-img {
    height: 110px;
    flex-shrink: 0;
  }
  .search-box { position: relative; flex: 1; max-width: 700px; align-self: center; }
  .search-input-row {
    display: flex;
    align-items: center;
    background: white;
    height: 42px;
    padding: 0 14px;
  }
  input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 0 6px;
    font-size: 14px;
    color: #2c2c2c;
    font-family: Arial, Helvetica, sans-serif;
  }
  input::placeholder { color: #7a7a7a; }
  .search-icon {
    color: #0071BA;
    font-size: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  .clear-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border: none;
    background: none;
    color: #9a9a9a;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .clear-btn:hover { color: #2c2c2c; }
  .clear-btn.show { display: flex; }

  .suggestions {
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #d9d9d9;
    display: none;
    z-index: 10;
    max-height: 176px;
    overflow-y: auto;
  }
  .suggestions.open { display: block; }
  .suggestion {
    padding: 11px 14px;
    cursor: pointer;
    font-size: 14px;
    color: #2c2c2c;
    border-bottom: 1px solid #eee;
  }
  .suggestion:last-child { border-bottom: none; }
  .suggestion:hover, .suggestion.active { background: #F5B333; }
  .empty {
    padding: 11px 14px;
    color: #8a8a8a;
    font-size: 13px;
  }

  .footnote {
    margin-top: 4px;
    font-size: 13px;
    font-weight: normal;
    font-family: "Haboro", Arial, Helvetica, sans-serif;
    color: #F5B333;
    text-align: center;
  }

  @media (max-width: 640px) {
    .top-row {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .logo-img {
      height: 60px;
      margin: 0 auto;
    }
    .search-box {
      max-width: none;
    }
  }
  @media (max-width: 400px) {
    .blue-box {
      padding: 12px 12px 14px;
    }
    .logo-img {
      height: 48px;
    }
    input[type="text"] {
      font-size: 13px;
    }
    .footnote {
      font-size: 12px;
    }
  }
  @media (max-width: 320px) {
    .logo-img {
      height: 40px;
    }
    .search-input-row {
      height: 38px;
    }
  }
  /* JS-driven fallback: matches the same 640px/400px thresholds as the media
     queries above, but reads the iframe's actual rendered width directly via
     window.innerWidth. This covers cases where the host page embeds this
     widget in an iframe that doesn't itself resize responsively — a plain
     CSS media query only sees the iframe's own document width, so if the
     iframe box is stuck at a fixed pixel width on mobile, the query above
     never fires even though the visible page is a phone screen. */
  .top-row.js-stacked {
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 10px !important;
  }
  .top-row.js-stacked .logo-img {
    height: 60px !important;
    margin: 0 auto !important;
  }
  .top-row.js-stacked .search-box {
    max-width: none !important;
  }
  .top-row.js-stacked.js-compact .logo-img {
    height: 48px !important;
  }
</style>
<script>
  function applyResponsiveStacking() {
    var row = document.querySelector('.top-row');
    if (!row) return;
    var w = window.innerWidth;
    row.classList.toggle('js-stacked', w <= 640);
    row.classList.toggle('js-compact', w <= 400);
  }
  window.addEventListener('DOMContentLoaded', applyResponsiveStacking);
  window.addEventListener('load', applyResponsiveStacking);
  window.addEventListener('resize', applyResponsiveStacking);
</script>
</head>
<body>

<div class="search-wrap">

<script>
const SERVICE_URL = "https://services6.arcgis.com/Hx8jJ6McXQ0jnqLk/arcgis/rest/services/Wicomico_Address_Points_Searchable/FeatureServer/1";
const ADDRESS_FIELD = "fulladdress";
const SEARCH_FIELD = "search_address";
const ID_FIELD = "OBJECTID";

const PRINT_PAGE_BASE = "https://sbygis.github.io/Snapshot/Snapshot.html";

const PARAM_MAP = {
  fulladdress:          "addr",
  district_name:        "district",
  rep_name:             "rep",
  rep_email:            "email",
  polling_name:         "pollinglocation",
  polling_addr:         "pollingaddr",
  cong_district:        "congdistrict",
  leg_district:         "legdistrict",
  precinct:             "precinct",
  council_district:     "councildistrict",
  trash_day:            "trash",
  in_floodplain:        "floodplain",
  in_critical_area:     "critical",
  zoning:               "zoning",
  police_sector:        "police",
  fire_station:         "firstdue",
  zip_code:             "zip",
  parcel_id:            "parcelid",
  sdat_url:             "sdat",
  in_opportunity_zone:  "opportunity",
  in_enterprise_zone:   "enterprise",
  historic_district:    "historic"
};

function deriveCityStatus(isInCity) {
  return isInCity
    ? "Within the City of Salisbury Corporate Limits"
    : "Outside the City of Salisbury Corporate Limits";
}

const ADDRESS_ABBREVIATIONS = {
  n: "north", north: "n",
  s: "south", south: "s",
  e: "east", east: "e",
  w: "west", west: "w",
  ne: "northeast", northeast: "ne",
  nw: "northwest", northwest: "nw",
  se: "southeast", southeast: "se",
  sw: "southwest", southwest: "sw",

  ave: "avenue", avenue: "ave",
  blvd: "boulevard", boulevard: "blvd",
  cir: "circle", circle: "cir",
  ct: "court", court: "ct",
  dr: "drive", drive: "dr",
  hwy: "highway", highway: "hwy",
  ln: "lane", lane: "ln",
  pkwy: "parkway", parkway: "pkwy",
  pl: "place", place: "pl",
  plz: "plaza", plaza: "plz",
  rd: "road", road: "rd",
  sq: "square", square: "sq",
  st: "street", street: "st",
  ter: "terrace", terrace: "ter",
  trl: "trail", trail: "trl",
  aly: "alley", alley: "aly",

  apt: "apartment", apartment: "apt",
  ste: "suite", suite: "ste",
  bldg: "building", building: "bldg",
  fl: "floor", floor: "fl"
};

function buildQueryVariants(q) {
  const words = q.trim().split(/\s+/);
  const variants = new Set([q.trim()]);
  words.forEach((word, idx) => {
    const swap = ADDRESS_ABBREVIATIONS[word.toLowerCase()];
    if (swap) {
      const alt = words.slice();
      alt[idx] = swap;
      variants.add(alt.join(" "));
    }
  });
  return Array.from(variants);
}

async function fetchSuggestions(q) {
  const variants = buildQueryVariants(q);
  const addressClauses = variants
    .map(v => `UPPER(${SEARCH_FIELD}) LIKE UPPER('${v.replace(/'/g, "''")}%')`)
    .join(" OR ");
  const where = `(${addressClauses}) AND UPPER(in_city) = 'YES'`;
  const url = `${SERVICE_URL}/query?where=${encodeURIComponent(where)}`
            + `&outFields=${SEARCH_FIELD},${ID_FIELD}&returnGeometry=false&f=json&resultRecordCount=4`;
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) { console.error("ArcGIS query error:", data.error); return []; }
  return (data.features || [])
    .map(f => ({ address: f.attributes[SEARCH_FIELD], id: f.attributes[ID_FIELD] }))
    .filter(r => r.address);
}

async function fetchFullRecord(id) {
  const url = `${SERVICE_URL}/query?where=${encodeURIComponent(ID_FIELD + "=" + id)}`
            + `&outFields=*&returnGeometry=false&f=json`;
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) { console.error("ArcGIS query error:", data.error); return null; }
  return (data.features && data.features[0]) ? data.features[0].attributes : null;
}

function buildSnapshotUrl(record) {
  const params = new URLSearchParams();
  const inCity = (record.in_city || "").toLowerCase();
  const isInCity = inCity === "yes" || inCity === "y" || inCity === "true";

  params.set("incity", isInCity ? "yes" : "no");
  params.set("citystatus", deriveCityStatus(isInCity));

  for (const fieldName in PARAM_MAP) {
    const value = record[fieldName];
    if (value !== undefined && value !== null && value !== "") {
      params.set(PARAM_MAP[fieldName], value);
    }
  }
  return `${PRINT_PAGE_BASE}?${params.toString()}`;
}

const input = document.getElementById('addr-input');
const suggBox = document.getElementById('suggestions');
const clearBtn = document.getElementById('clear-btn');

let currentMatches = [];
let activeIndex = -1;
let debounceTimer = null;
let selectedId = null;

input.addEventListener('input', () => {
  selectedId = null;
  clearBtn.classList.toggle('show', input.value.length > 0);
  const q = input.value.trim();
  clearTimeout(debounceTimer);
  if (q.length < 2) { closeSuggestions(); return; }
  debounceTimer = setTimeout(async () => {
    currentMatches = await fetchSuggestions(q);
    renderSuggestions(currentMatches);
  }, 180);
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  selectedId = null;
  clearBtn.classList.remove('show');
  closeSuggestions();
  input.focus();
});

input.addEventListener('keydown', (e) => {
  if (!suggBox.classList.contains('open')) return;
  const items = suggBox.querySelectorAll('.suggestion');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeIndex = Math.min(activeIndex + 1, items.length - 1);
    highlight(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
    highlight(items);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIndex >= 0 && currentMatches[activeIndex]) {
      selectAddress(currentMatches[activeIndex]);
    }
  } else if (e.key === 'Escape') {
    closeSuggestions();
  }
});

function highlight(items) {
  items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
}

function renderSuggestions(matches) {
  activeIndex = -1;
  if (!matches.length) {
    suggBox.innerHTML = `<div class="empty">No matching address found.</div>`;
    suggBox.classList.add('open');
    return;
  }
  suggBox.innerHTML = matches.map(m => `
    <div class="suggestion" data-id="${escapeHtml(String(m.id))}" data-addr="${escapeHtml(m.address)}">
      ${escapeHtml(m.address)}
    </div>
  `).join('');
  suggBox.classList.add('open');
  suggBox.querySelectorAll('.suggestion').forEach(el => {
    el.addEventListener('click', () => selectAddress({ id: el.dataset.id, address: el.dataset.addr }));
  });
}

function closeSuggestions() {
  suggBox.classList.remove('open');
  suggBox.innerHTML = '';
}

async function selectAddress(match) {
  input.value = match.address;
  clearBtn.classList.add('show');
  selectedId = match.id;
  closeSuggestions();

  const newTab = window.open('', '_blank');

  const record = await fetchFullRecord(selectedId);
  if (!record) {
    if (newTab) newTab.close();
    return;
  }
  const url = buildSnapshotUrl(record);
  if (newTab) {
    newTab.location.href = url;
  } else {
    window.open(url, '_blank');
  }
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-box')) closeSuggestions();
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function reportHeight() {
  const box = document.querySelector('.blue-box');
  if (!box) return;
  const height = Math.ceil(box.getBoundingClientRect().height);
  window.parent.postMessage({ type: 'sby-search-resize', height: height }, '*');
}

window.addEventListener('load', reportHeight);
if (window.ResizeObserver) {
  const ro = new ResizeObserver(reportHeight);
  const box = document.querySelector('.blue-box');
  if (box) ro.observe(box);
} else {
  setInterval(reportHeight, 400);
}
</script>
</body>
</html>
